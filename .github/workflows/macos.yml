name: Platform packages

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: package
        options: [package, package-all, windows, warm, warm-windows, renderer-qa]
      build_tag:
        type: string
        default: ci-inputs-0.5.6
      component_sha256:
        type: string
      pylon_tag:
        type: string
        description: Optional draft input tag for the actual Java SDL Metal surface probe
      pylon_sha256:
        type: string
        description: Exact Pylon JAR SHA-256, also checked against the source component catalog
      skiko_tag:
        type: string
        description: Optional private input tag for the actual shipped Skiko Metal lease smoke
      skiko_sha256:
        type: string
        description: Exact whitelisted Skiko/font archive SHA-256
      metal_client_tag:
        type: string
        description: Optional draft input tag for the private fake-account Minecraft composition probe
      metal_client_sha256:
        type: string
        description: Exact public-input archive SHA-256
      metal_client_qa_sha256:
        type: string
        description: Exact compiled private QA JAR SHA-256
      metal_client_defaults_sha256:
        type: string
        description: Exact fresh-profile defaults certificate SHA-256
      presentation_ownership:
        type: choice
        default: backed
        options: [backed, compare-hosted]
        description: Optional isolated compositor-owned hosted layer comparison

permissions:
  contents: read

jobs:
  build:
    if: inputs.mode == 'package' || inputs.mode == 'package-all' || inputs.mode == 'warm'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            minimum: '13.0'
            jobs: '2'
          - runner: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            minimum: '12.0'
            jobs: '3'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TARGET_DIR: target
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-source-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ inputs.mode }}
          restore-keys: macos-source-v1-${{ matrix.platform }}-
      - name: Warm native dependencies
        if: inputs.mode == 'warm'
        run: cargo build --locked --profile macos-testing --target '${{ matrix.target }}' -p freya
      - name: Import verified client components
        if: inputs.mode == 'package' || inputs.mode == 'package-all'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ inputs.build_tag }}
          COMPONENT_SHA256: ${{ inputs.component_sha256 }}
        run: |
          gh release download "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --pattern ArcadiumBuildInputs.zip --dir "$RUNNER_TEMP/components"
          python3 scripts/import_build_components.py "$RUNNER_TEMP/components/ArcadiumBuildInputs.zip" --sha256 "$COMPONENT_SHA256"
      - name: Build launcher and verify accent rendering
        if: inputs.mode == 'package' || inputs.mode == 'package-all'
        run: |
          cargo build --locked --profile macos-testing --target '${{ matrix.target }}' -p arcadium_app --bin Arcadium
          cargo test --locked --profile macos-testing --target '${{ matrix.target }}' -p arcadium_app --lib theme::accent -- --test-threads=1
          cargo test --locked --profile macos-testing --target '${{ matrix.target }}' -p arcadium_app --lib updater::tests -- --test-threads=1
          cargo test --locked --profile macos-testing --target '${{ matrix.target }}' -p arcadium_app --lib components::update_prompt::tests -- --test-threads=1
          cargo test --locked --profile macos-testing --target '${{ matrix.target }}' -p arcadium_core --lib game::settings_share::tests -- --test-threads=1
      - name: Package and verify macOS application
        if: inputs.mode == 'package' || inputs.mode == 'package-all'
        run: |
          python3 scripts/build_macos.py --target '${{ matrix.target }}' --skip-compile
          python3 scripts/check_macos_compatibility.py --binary "$CARGO_TARGET_DIR/${{ matrix.target }}/macos-testing/Arcadium" --target '${{ matrix.target }}' --minimum '${{ matrix.minimum }}' --static-root "$CARGO_TARGET_DIR/${{ matrix.target }}/macos-testing" --fetch-sdk --output build/macos-compatibility-tests.json
          python3 scripts/smoke_native_helpers.py --executable "$CARGO_TARGET_DIR/${{ matrix.target }}/macos-testing/Arcadium" --output build/macos-native-helper-tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (inputs.mode == 'package' || inputs.mode == 'package-all') && always()
        with:
          name: ${{ matrix.platform }}
          path: |
            build/installers/${{ matrix.platform }}/
            build/macos-compatibility-tests.json
            build/macos-native-helper-tests.json
            build/theme-accent-evidence/
          if-no-files-found: warn
          retention-days: 3

  windows:
    if: inputs.mode == 'windows' || inputs.mode == 'package-all' || inputs.mode == 'warm-windows'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TARGET_DIR: target
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.99.0'
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-source-v1-x64-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ inputs.mode }}
          restore-keys: windows-source-v1-x64-
      - name: Import verified client components
        if: inputs.mode != 'warm-windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ inputs.build_tag }}
          COMPONENT_SHA256: ${{ inputs.component_sha256 }}
        run: |
          gh release download $env:BUILD_TAG --repo $env:GITHUB_REPOSITORY --pattern ArcadiumBuildInputs.zip --dir "$env:RUNNER_TEMP/components"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the component archive.' }
          python scripts/import_build_components.py "$env:RUNNER_TEMP/components/ArcadiumBuildInputs.zip" --sha256 $env:COMPONENT_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Component archive verification failed.' }
      - name: Build Windows launcher
        shell: pwsh
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsRoot) { throw 'Visual Studio C++ build tools are missing.' }
          $vcvars = Join-Path $vsRoot 'VC/Auxiliary/Build/vcvars64.bat'
          $vcEnvironment = & cmd /d /s /c "call ""$vcvars"" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the MSVC environment.' }
          foreach ($row in $vcEnvironment) {
            $separator = $row.IndexOf('=')
            if ($separator -gt 0) {
              [Environment]::SetEnvironmentVariable($row.Substring(0, $separator), $row.Substring($separator + 1), 'Process')
            }
          }
          if ($env:BUILD_MODE -eq 'warm-windows') {
            cargo build --release --locked --target x86_64-pc-windows-msvc -p freya
          } else {
            cargo build --release --locked --target x86_64-pc-windows-msvc -p arcadium_app --bin Arcadium
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher build failed.' }
      - name: Package and verify Windows installer
        if: inputs.mode != 'warm-windows'
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $makensis)) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
          ./scripts/build_windows.ps1 -TargetDirectory $env:CARGO_TARGET_DIR -JavaHome $env:JAVA_HOME -Makensis $makensis -SkipCompile
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the launcher version.' }
          ./scripts/verify_windows_installer.ps1 -Version $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.mode != 'warm-windows' && always()
        with:
          name: windows-x64
          path: |
            build/installers/ArcadiumClientSetup-*-x64.exe
            build/installers/package-manifest.json
            build/windows-*-installer-checks.json
            build/windows-*-native-helper-tests.json
          if-no-files-found: warn
          retention-days: 3

  resident-renderer:
    if: inputs.mode == 'renderer-qa'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch optional pinned Pylon surface input
        if: inputs.pylon_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PYLON_TAG: ${{ inputs.pylon_tag }}
          PYLON_SHA256: ${{ inputs.pylon_sha256 }}
        run: |
          test -n "$PYLON_SHA256"
          gh release download "$PYLON_TAG" --repo "$GITHUB_REPOSITORY" --pattern ArcadiumPylon-1.8.9.jar --dir "$RUNNER_TEMP/pylon-surface"
      - name: Fetch optional pinned Skiko Metal input
        if: inputs.skiko_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SKIKO_TAG: ${{ inputs.skiko_tag }}
          SKIKO_SHA256: ${{ inputs.skiko_sha256 }}
        run: |
          test -n "$SKIKO_SHA256"
          gh release download "$SKIKO_TAG" --repo "$GITHUB_REPOSITORY" --pattern ArcadiumSkikoMetalInputs-073.zip --dir "$RUNNER_TEMP/skiko-metal"
      - name: Compile and test the native Metal prototype
        env:
          CFLAGS: -Werror=unguarded-availability -Werror=unguarded-availability-new
          OBJCFLAGS: -Werror=unguarded-availability -Werror=unguarded-availability-new
          PYLON_TAG: ${{ inputs.pylon_tag }}
          PYLON_SHA256: ${{ inputs.pylon_sha256 }}
          SKIKO_TAG: ${{ inputs.skiko_tag }}
          SKIKO_SHA256: ${{ inputs.skiko_sha256 }}
        run: |
          args=(--arch '${{ matrix.arch }}')
          if [ -n "$PYLON_TAG" ]; then
            args+=(--pylon-jar "$RUNNER_TEMP/pylon-surface/ArcadiumPylon-1.8.9.jar" --pylon-sha256 "$PYLON_SHA256")
          else
            test -z "$PYLON_SHA256"
          fi
          if [ -n "$SKIKO_TAG" ]; then
            args+=(--skiko-inputs "$RUNNER_TEMP/skiko-metal/ArcadiumSkikoMetalInputs-073.zip" --skiko-sha256 "$SKIKO_SHA256")
          else
            test -z "$SKIKO_SHA256"
          fi
          python3 client-runtime/native/renderer/build.py "${args[@]}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: inputs.metal_client_tag != ''
        with:
          python-version: '3.13'
      - name: Compare compositor-owned hosted layer presentation
        if: always() && inputs.presentation_ownership == 'compare-hosted'
        env:
          CFLAGS: -Werror=unguarded-availability -Werror=unguarded-availability-new
          OBJCFLAGS: -Werror=unguarded-availability -Werror=unguarded-availability-new
          PYLON_TAG: ${{ inputs.pylon_tag }}
          PYLON_SHA256: ${{ inputs.pylon_sha256 }}
        run: |
          test -n "$PYLON_TAG"
          test -n "$PYLON_SHA256"
          python3 client-runtime/native/renderer/build.py --arch '${{ matrix.arch }}' --output 'build/resident-renderer/${{ matrix.arch }}-hosted' --hosted-layer-experiment --pylon-jar "$RUNNER_TEMP/pylon-surface/ArcadiumPylon-1.8.9.jar" --pylon-sha256 "$PYLON_SHA256"
      - name: Fetch optional pinned fake-client inputs
        if: inputs.metal_client_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          METAL_CLIENT_TAG: ${{ inputs.metal_client_tag }}
          METAL_CLIENT_SHA256: ${{ inputs.metal_client_sha256 }}
          METAL_CLIENT_QA_SHA256: ${{ inputs.metal_client_qa_sha256 }}
          METAL_CLIENT_DEFAULTS_SHA256: ${{ inputs.metal_client_defaults_sha256 }}
          PYLON_TAG: ${{ inputs.pylon_tag }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'ci-metal-client-072-[a-f0-9]{8,64}', os.environ['METAL_CLIENT_TAG'])
          assert os.environ['PYLON_TAG'], 'The actual Pylon SDL Metal surface probe is required first'
          for name in ('METAL_CLIENT_SHA256','METAL_CLIENT_QA_SHA256','METAL_CLIENT_DEFAULTS_SHA256'):
              assert re.fullmatch(r'[a-f0-9]{64}', os.environ[name]), 'Missing exact private input checksum'
          PY
          gh release download "$METAL_CLIENT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/metal-client" --pattern ArcadiumMetalClientPublicInputs-072.zip --pattern "ArcadiumMetalClientQa-$METAL_CLIENT_QA_SHA256.jar" --pattern ArcadiumMetalClientDefaults-072.json
      - name: Test actual Minecraft Skiko composition through the private Metal surface
        if: inputs.metal_client_tag != ''
        env:
          METAL_CLIENT_SHA256: ${{ inputs.metal_client_sha256 }}
          METAL_CLIENT_QA_SHA256: ${{ inputs.metal_client_qa_sha256 }}
          METAL_CLIENT_DEFAULTS_SHA256: ${{ inputs.metal_client_defaults_sha256 }}
          PROBE_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path.cwd()
          output=root/'build/resident-renderer'/os.environ['PROBE_ARCH']
          inputs=pathlib.Path(os.environ['RUNNER_TEMP'])/'metal-client'
          verification_path=output/'verification.json'
          verification=json.loads(verification_path.read_text())
          assert verification['passed'] and verification['javaSdlMetalSurface']=='passed'
          assert verification['metalDeviceTest']=='passed' and verification['nativeWindowPresentation']=='passed'
          native=pathlib.Path(verification['nativeLibrary']).resolve(strict=True)
          assert native.is_relative_to((output/'native').resolve()) and native.suffix=='.dylib'
          shader=root/'client-runtime/native/renderer/tests/reference_scene.metal'
          def sha(path):
              with path.open('rb') as source: return hashlib.file_digest(source,'sha256').hexdigest()
          fixture=output/'ArcadiumMetalClient072-CI'
          command=[sys.executable,'scripts/run_metal_client_probe.py',
              '--inputs',str(inputs/'ArcadiumMetalClientPublicInputs-072.zip'),'--inputs-sha256',os.environ['METAL_CLIENT_SHA256'],
              '--qa',str(inputs/('ArcadiumMetalClientQa-'+os.environ['METAL_CLIENT_QA_SHA256']+'.jar')),'--qa-sha256',os.environ['METAL_CLIENT_QA_SHA256'],
              '--defaults-proof',str(inputs/'ArcadiumMetalClientDefaults-072.json'),'--defaults-sha256',os.environ['METAL_CLIENT_DEFAULTS_SHA256'],
              '--source-commit',os.environ['GITHUB_SHA'],'--fixture',str(fixture),'--java',str(pathlib.Path(os.environ['JAVA_HOME'])/'bin/java'),
              '--native-library',str(native),'--native-sha256',sha(native),'--shader',str(shader),'--shader-sha256',sha(shader),
              '--stored-off-reload','--launch']
          provenance={'sourceCommit':os.environ['GITHUB_SHA'],'runnerSha256':sha(root/'scripts/run_metal_client_probe.py'),
              'nativeLibrarySha256':sha(native),'referenceShaderSha256':sha(shader),'nativeVerificationSha256':sha(verification_path),
              'inputSha256':os.environ['METAL_CLIENT_SHA256'],'qaSha256':os.environ['METAL_CLIENT_QA_SHA256'],
              'defaultsSha256':os.environ['METAL_CLIENT_DEFAULTS_SHA256'],'fakeAccountOnly':True,'performanceClaim':False}
          (output/'metal-client-ci-inputs.json').write_text(json.dumps(provenance,indent=2)+'\n')
          subprocess.run(command,check=True)
          run_path=fixture/'evidence/run.json'
          run=json.loads(run_path.read_text())
          result=run['result']
          assert run['passed'] and run['naturalExit'] and run['terminationVerified'] and not run['forcedTermination']
          assert result['controlGl'] is False and result['freshDefaultsVerified'] and result['normalShutdownComplete']
          captures=result['captures']
          assert [row['name'] for row in captures]==['title','options','title-resized','title-gl-fallback']
          previous=0
          for row in captures[:3]:
              assert row['metalDisplayed']>previous and row['metalSubmitted']>=row['metalDisplayed'] and row['originalGlSwaps']==0
              previous=row['metalDisplayed']
          assert captures[-1]['originalGlSwaps']>0 and result['skikoFlushes']>0 and result['composeSubmits']>0
          for row in captures: assert sha(fixture/'evidence'/(row['name']+'.png'))==row['sha256']
          qualification={**provenance,'passed':True,'runSha256':sha(run_path),'captures':captures,
              'scope':'Real Minecraft title/Skiko options/resize/current-frame Metal transport/explicit GL fallback only',
              'worldOrCeraQualified':False,'fullMetalRendererQualified':False,'publicGameRelease':False}
          (output/'metal-client-qualification.json').write_text(json.dumps(qualification,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resident-renderer-${{ matrix.arch }}
          path: |
            build/resident-renderer/${{ matrix.arch }}/*.json
            build/resident-renderer/${{ matrix.arch }}/*.log
            build/resident-renderer/${{ matrix.arch }}/*.xml
            build/resident-renderer/${{ matrix.arch }}-hosted/*.json
            build/resident-renderer/${{ matrix.arch }}-hosted/*.log
            build/resident-renderer/${{ matrix.arch }}-hosted/*.xml
            build/resident-renderer/${{ matrix.arch }}/ArcadiumMetalClient072-CI/evidence/
          if-no-files-found: warn
          retention-days: 7
