[package]
name = "arcadium_app"
description = "Arcadium Client launcher for Minecraft 1.8.9"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[features]
default = []

[dependencies]
arcadium_auth.workspace = true
arcadium_cluster.workspace = true
arcadium_common.workspace = true
arcadium_content.workspace = true
arcadium_events.workspace = true
arcadium_java.workspace = true
arcadium_mc.workspace = true
arcadium_net.workspace = true
arcadium_core.workspace = true
arcadium_db.workspace = true
chrono.workspace = true
arcadium_macro = { workspace = true, features = ["freya"] }

arcadium_io.workspace = true
rust-embed.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
bytes.workspace = true
sysinfo.workspace = true

notify.workspace = true

anyhow.workspace = true
regex.workspace = true
directories.workspace = true
dunce.workspace = true
percent-encoding.workspace = true

arcadium_update.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

# rfd = "=0.17.2"
# open = "=5.4.0"
rfd.workspace = true
open.workspace = true

# clipboard image copy + decode for it
arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
freya.workspace = true
freya-core.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
freya-testing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
mimalloc = "=0.1.52"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std", "NSApplication", "NSImage", "NSRunningApplication", "NSScreen", "NSView", "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std", "NSData", "NSDate", "NSDictionary", "NSGeometry", "NSHTTPCookie", "NSRunLoop", "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"
gtk-sys = "=0.18.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
] }
webview2-com = "=0.39.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "Arcadium Client"
identifier = "io.github.arcadiumclient.launcher"
category = "Game"
publisher = "0aurorq3"
copyright = "Copyright 2026 0aurorq3"
homepage = "https://github.com/1y23qq/arcadiumclient"
long-description = "Arcadium Client for Minecraft 1.8.9."
formats = ["nsis"]
binaries = [{ path = "Arcadium", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
resources = [
  { src = "icons/generated/Assets.car", target = "Assets.car" },
  # >>> CRT_RESOURCES >>>
  # <<< CRT_RESOURCES <<<
]

[package.metadata.packager.macos]
minimum-system-version = "12.0"
entitlements = "distribution/App.entitlements"
info-plist-path = "distribution/Info.plist"

[package.metadata.packager.dmg]
background = "distribution/dmg-background.tiff"
window-size = { width = 600, height = 400 }
app-position = { x = 160, y = 190 }
application-folder-position = { x = 440, y = 190 }

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "https://timestamp.digicert.com"

[package.metadata.packager.nsis]
preinstall-section = """
; >>> VC_REDIST_SECTION >>>
Section "-VCRedist"
  SetRegView 64
  ReadRegDWORD $R0 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Installed"
  ReadRegDWORD $R1 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Minor"
  SetRegView lastused

  ${If} $R0 == 1
  ${AndIf} $R1 >= 40
    Goto vcredist_done
  ${EndIf}

  ${If} $PassiveMode != 1
    MessageBox MB_OK|MB_ICONEXCLAMATION "This build of Arcadium Client needs the Microsoft Visual C++ Redistributable (x64) 14.40 or newer. Install it from https://aka.ms/vs/17/release/vc_redist.x64.exe, then run this installer again."
  ${EndIf}

  vcredist_done:
SectionEnd
; <<< VC_REDIST_SECTION <<<
"""

[package.metadata.packager.deb]
desktop-template = "distribution/linux/org.polyfrost.oneclient.template"

[package.metadata.packager.appimage]
# desktop entry generated from the deb template above via the linux config
libs = ["libayatana-appindicator3.so.1"]
excluded-libraries = ["libwayland-*"]

[package.metadata.generate-rpm]
auto-req = "builtin"
assets = [
  { source = "target/release/arcadium_app", dest = "/usr/bin/arcadium_app", mode = "755" },
  { source = "target/release/arcadium_app.desktop", dest = "/usr/share/applications/arcadium_app.desktop", mode = "644" },
  { source = "icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/arcadium_app.png", mode = "644" },
  { source = "icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/arcadium_app.png", mode = "644" },
  { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/arcadium_app.png", mode = "644" },
  { source = "icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/arcadium_app.png", mode = "644" },
]


[[bin]]
name = "Arcadium"
path = "src/main.rs"
