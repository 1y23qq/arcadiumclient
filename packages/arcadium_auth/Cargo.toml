[package]
name = "arcadium_auth"
description = "Microsoft/Xbox/Minecraft authentication and the credentials store"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
arcadium_common.workspace = true
arcadium_events.workspace = true
arcadium_net.workspace = true
arcadium_io.workspace = true

reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true

base64.workspace = true
chrono.workspace = true
# Offline UUIDs are MD5 of "OfflinePlayer:<name>", per Mojang.
md-5.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
